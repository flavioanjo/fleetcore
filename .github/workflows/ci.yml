name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Fuzz protocol decoder (short)
        if: runner.os == 'Linux'
        run: go test -run='^$' -fuzz=FuzzDecodeSample -fuzztime=30s ./internal/protocol

      - name: Simulator smoke test
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/fleet-sim -seed 7 -vehicles 2 -samples 3 > a.jsonl
          go run ./cmd/fleet-sim -seed 7 -vehicles 2 -samples 3 > b.jsonl
          cmp a.jsonl b.jsonl
          test "$(wc -l < a.jsonl)" -eq 18
